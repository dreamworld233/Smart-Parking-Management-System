server:
  port: 8080

# JWT 配置：secret 用于 HS256 签名（须 >= 32 字节），expire-ms 为有效期
jwt:
  secret: "spms-secret-key-2026-change-me-to-random-64bytes-abcdef0123456789"
  expire-ms: 604800000

spring:
  application:
    name: backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smartparking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "114514"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    # 下划线字段（member_type）自动映射驼峰（memberType）
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL 到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
